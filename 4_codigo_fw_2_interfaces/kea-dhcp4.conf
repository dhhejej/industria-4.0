{
"Dhcp4": {
    // 1. Interfaces en las que va a escuchar el servidor
    "interfaces-config": {
        "interfaces": [ "enp0s31f6" ]


    },

    // 2. Almacenamiento de las concesiones de IP (Leases) en memoria
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv"
    },

    // 3. Tiempos de renovación de IPs por defecto (en segundos)
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,

    // 4. Configuracion global de Opciones (DNS principales)
    "option-data": [
        {
            "name": "domain-name-servers",
            "data": "96.45.45.45,96.45.45.46"
        }
    ],

    // 5. Definicion de la Subred y Rangos de asignacion
    "subnet4": [
        {
            "id": 1,
            "subnet": "192.168.100.0/24",
	    "interface": "enp0s31f6",
            "pools": [
                {
                    // Rango de IPs que se entregaran dinamicamente
                    "pool": "192.168.100.50 - 192.168.100.100"
                }
            ],
	    "reservations": [
                {
                    "hw-address": "5e:e8:cc:9b:42:b0",
                    "ip-address": "192.168.100.200"
                },
                {
                    "hw-address": "00:11:22:33:44:55",
                    "ip-address": "192.168.100.201"
                }
            ],
            "option-data": [
                {
                    // Puerta de enlace (Router) para los clientes
                    "name": "routers",
                    "data": "192.168.100.1"
                }
            ]

	    
        },

//--------



	



    ]
}
}